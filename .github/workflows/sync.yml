name: Finance Data Sync

on:
  schedule:
    # Run every 5 minutes (Note: GitHub Actions may delay this slightly)
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-teller:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Setup Certs
        run: |
          mkdir -p backend/certs
          echo "${{ secrets.TELLER_CERT }}" > backend/certs/certificate.pem
          echo "${{ secrets.TELLER_KEY }}" > backend/certs/private_key.pem

      - name: Run Sync
        env:
          TELLER_TOKEN: ${{ secrets.TELLER_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CERT: certs/certificate.pem
          CERT_KEY: certs/private_key.pem
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        working-directory: backend
        run: |
          python main.py
