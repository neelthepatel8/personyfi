<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finance OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Context7 (apache/echarts-doc): include echarts.min.js and init with echarts.init(...);
  calendar heatmap uses calendar + heatmap series with coordinateSystem: 'calendar'.
  -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
    :root {
      --bg: #f5f7fb;
      --bg-2: #e8f1ff;
      --ink: #0f172a;
      --muted: #5f6b7a;
      --surface: #ffffff;
      --accent: #0ea5a6;
      --accent-2: #ff7a59;
      --accent-3: #2563eb;
      --border: rgba(15, 23, 42, 0.12);
      --shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
      --radius: 20px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      color: var(--ink);
      background: linear-gradient(140deg, var(--bg) 0%, var(--bg-2) 100%);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      z-index: -1;
    }

    body::before {
      top: -160px;
      left: -120px;
      background: rgba(14, 165, 166, 0.6);
    }

    body::after {
      top: 60px;
      right: -160px;
      background: rgba(37, 99, 235, 0.5);
    }

    .wrap {
      max-width: 1220px;
      margin: 0 auto;
      padding: 0 22px 60px;
    }

    header {
      padding: 48px 0 24px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 18px;
    }

    .title {
      font-size: 36px;
      font-weight: 700;
      margin: 0 0 8px;
      letter-spacing: -0.4px;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      max-width: 560px;
      line-height: 1.5;
      font-size: 15px;
    }

    .status-grid,
    .totals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      animation: rise 0.5s ease both;
    }

    .stat-card h3 {
      margin: 0 0 6px;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 1.1px;
      color: var(--muted);
    }

    .stat-card .value {
      font-size: 20px;
      font-weight: 600;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .panel-title {
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 12px;
      color: var(--muted);
      margin: 0;
    }

    .toolbar {
      margin: 20px 0;
      display: grid;
      gap: 16px;
    }

    .toolbar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .field label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      font-family: inherit;
      font-size: 14px;
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .chip {
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      background: #f8fafc;
      font-size: 12px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip.active {
      background: rgba(37, 99, 235, 0.12);
      border-color: rgba(37, 99, 235, 0.3);
      color: var(--accent-3);
    }

    .btn {
      border: none;
      padding: 10px 16px;
      border-radius: 999px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn.primary {
      background: var(--accent-3);
      color: #fff;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.3);
    }

    .btn.secondary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 10px 24px rgba(14, 165, 166, 0.3);
    }

    .btn.outline {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--ink);
    }

    .btn.accent {
      background: var(--accent-2);
      color: #fff;
      box-shadow: 0 10px 24px rgba(255, 122, 89, 0.3);
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .status-line {
      font-size: 13px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 16px;
    }

    .span-5 { grid-column: span 5; }
    .span-6 { grid-column: span 6; }
    .span-7 { grid-column: span 7; }
    .span-8 { grid-column: span 8; }
    .span-12 { grid-column: span 12; }

    .chart {
      width: 100%;
      height: 320px;
    }

    .chart.tall { height: 380px; }

    .micro-grid {
      display: grid;
      gap: 10px;
    }

    .micro-stat {
      display: flex;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(37, 99, 235, 0.06);
      border: 1px solid rgba(37, 99, 235, 0.12);
      font-size: 14px;
    }

    .merchants-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
    }

    .merchants-list li {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      padding-bottom: 6px;
      border-bottom: 1px dashed rgba(15, 23, 42, 0.1);
    }

    .rules-list {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .rule-pill {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(14, 165, 166, 0.12);
      color: var(--accent);
      border: 1px solid rgba(14, 165, 166, 0.25);
      font-size: 12px;
      letter-spacing: 0.4px;
    }

    .rules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }

    .rules-grid input,
    .rules-grid select {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 13px;
    }

    .rules-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
    }

    .transactions {
      margin-top: 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      text-align: left;
    }

    th {
      text-transform: uppercase;
      letter-spacing: 0.9px;
      font-size: 11px;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.04);
    }

    td.amount {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    .amount.negative { color: #d14a36; }
    .amount.positive { color: #1e9e89; }

    .pill {
      display: inline-flex;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 122, 89, 0.12);
      color: var(--accent-2);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .mini-btn {
      border: none;
      background: transparent;
      color: var(--accent-3);
      cursor: pointer;
      font-size: 12px;
      margin-left: 6px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 960px) {
      .span-5, .span-6, .span-7, .span-8 { grid-column: span 12; }
      .chart, .chart.tall { height: 280px; }
    }

    @media (max-width: 720px) {
      .toolbar-actions {
        flex-direction: column;
        align-items: flex-start;
      }
      table, thead, tbody, th, td, tr {
        display: block;
      }
      thead { display: none; }
      tr {
        border-bottom: 1px solid var(--border);
        padding: 12px 0;
      }
      td {
        border: none;
        padding: 6px 0;
      }
      td::before {
        content: attr(data-label);
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        color: var(--muted);
        letter-spacing: 0.6px;
      }
      td.amount { text-align: left; }
    }
  </style>
</head>
<body>
  <header class="wrap">
    <div class="hero">
      <div>
        <h1 class="title">Finance OS</h1>
        <p class="subtitle">High-signal dashboards for your Teller ledger. Use rules or AI to classify, then scan spend patterns without the noise of internal transfers.</p>
      </div>
      <div class="button-row">
        <button id="refreshBtn" class="btn primary">Refresh</button>
        <button id="ingestBtn" class="btn secondary">Ingest now</button>
      </div>
    </div>
    <section class="status-grid" id="statusCards"></section>
  </header>

  <main class="wrap">
    <section class="panel toolbar">
      <div class="toolbar-grid">
        <div class="field">
          <label for="accountSelect">Account</label>
          <select id="accountSelect"></select>
        </div>
        <div class="field">
          <label for="startDate">Start date</label>
          <input id="startDate" type="date" />
        </div>
        <div class="field">
          <label for="endDate">End date</label>
          <input id="endDate" type="date" />
        </div>
        <div class="field">
          <label for="limit">Limit</label>
          <input id="limit" type="number" min="1" max="10000" value="200" />
        </div>
      </div>
      <div class="toolbar-actions">
        <div class="button-row">
          <button id="yearBtn" class="chip">Year</button>
          <button id="monthBtn" class="chip">Month</button>
        </div>
        <div class="button-row">
          <button id="applyRulesBtn" class="btn outline">Apply rules</button>
          <button id="llmBtn" class="btn accent">AI categorize</button>
        </div>
      </div>
      <div class="status-line" id="statusLine">Loading...</div>
    </section>

    <section class="totals-grid" id="totalsCards"></section>

    <section class="grid">
      <div class="panel span-7">
        <div class="panel-header">
          <p class="panel-title">Daily Spend Calendar</p>
        </div>
        <div id="calendarChart" class="chart"></div>
      </div>
      <div class="panel span-5">
        <div class="panel-header">
          <p class="panel-title">Cashflow Sankey</p>
        </div>
        <div id="sankeyChart" class="chart"></div>
      </div>
      <div class="panel span-8">
        <div class="panel-header">
          <p class="panel-title">Category Treemap</p>
        </div>
        <div id="treemapChart" class="chart tall"></div>
      </div>
      <div class="panel span-4">
        <div class="panel-header">
          <p class="panel-title">Micro-spend Mix</p>
        </div>
        <div id="microChart" class="chart"></div>
        <div class="micro-grid" id="microStats"></div>
      </div>
      <div class="panel span-6">
        <div class="panel-header">
          <p class="panel-title">Top Merchants</p>
        </div>
        <ul class="merchants-list" id="topMerchants"></ul>
      </div>
      <div class="panel span-6">
        <div class="panel-header">
          <p class="panel-title">Rules</p>
          <button id="reloadRulesBtn" class="btn outline">Reload</button>
        </div>
        <div class="rules-list" id="rulesList"></div>
        <div class="rules-grid">
          <input id="rulePattern" placeholder="amazon, NETFLIX, .*UBER.*" />
          <select id="ruleMatch">
            <option value="contains">Contains</option>
            <option value="regex">Regex</option>
          </select>
          <input id="ruleCategory" placeholder="dining" />
          <input id="ruleMerchant" placeholder="Merchant override" />
          <input id="rulePriority" type="number" value="100" />
        </div>
        <div class="rules-actions">
          <label><input id="ruleApply" type="checkbox" checked /> Apply to current window</label>
          <button id="saveRuleBtn" class="btn primary">Save rule</button>
        </div>
      </div>
    </section>

    <section class="panel transactions span-12">
      <div class="panel-header">
        <p class="panel-title">Transactions</p>
      </div>
      <div id="tableWrap"></div>
    </section>
  </main>

  <script>
    const accountSelect = document.getElementById('accountSelect');
    const startDateInput = document.getElementById('startDate');
    const endDateInput = document.getElementById('endDate');
    const limitInput = document.getElementById('limit');
    const refreshBtn = document.getElementById('refreshBtn');
    const ingestBtn = document.getElementById('ingestBtn');
    const applyRulesBtn = document.getElementById('applyRulesBtn');
    const llmBtn = document.getElementById('llmBtn');
    const yearBtn = document.getElementById('yearBtn');
    const monthBtn = document.getElementById('monthBtn');
    const statusLine = document.getElementById('statusLine');
    const statusCards = document.getElementById('statusCards');
    const totalsCards = document.getElementById('totalsCards');
    const tableWrap = document.getElementById('tableWrap');
    const topMerchants = document.getElementById('topMerchants');
    const microStats = document.getElementById('microStats');
    const rulesList = document.getElementById('rulesList');
    const reloadRulesBtn = document.getElementById('reloadRulesBtn');
    const rulePattern = document.getElementById('rulePattern');
    const ruleMatch = document.getElementById('ruleMatch');
    const ruleCategory = document.getElementById('ruleCategory');
    const ruleMerchant = document.getElementById('ruleMerchant');
    const rulePriority = document.getElementById('rulePriority');
    const ruleApply = document.getElementById('ruleApply');
    const saveRuleBtn = document.getElementById('saveRuleBtn');

    const charts = {};

    function formatMoney(value) {
      if (value === null || value === undefined) return '';
      const number = Number(value);
      if (Number.isNaN(number)) return value;
      return number.toLocaleString(undefined, { style: 'currency', currency: 'USD' });
    }

    function setStatus(message, kind) {
      statusLine.textContent = message;
      statusLine.style.color = kind === 'error' ? '#d14a36' : '';
    }

    function ensureChart(id) {
      if (!charts[id]) {
        charts[id] = echarts.init(document.getElementById(id));
      }
      return charts[id];
    }

    function toDateInputValue(date) {
      return date.toISOString().slice(0, 10);
    }

    function setRange(start, end) {
      startDateInput.value = toDateInputValue(start);
      endDateInput.value = toDateInputValue(end);
    }

    function activateRange(button) {
      [yearBtn, monthBtn].forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
    }

    function setDefaultRange() {
      const now = new Date();
      const start = new Date(now);
      start.setFullYear(start.getFullYear() - 1);
      setRange(start, now);
      activateRange(yearBtn);
    }

    function setMonthRange() {
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), 1);
      setRange(start, now);
      activateRange(monthBtn);
    }

    async function loadStatus() {
      const res = await fetch('/status');
      const data = await res.json();
      statusCards.innerHTML = '';
      const cards = [
        { title: 'Last ingest', value: data.last_ingest_at || 'n/a' },
        { title: 'Last error', value: data.last_ingest_error || 'none' },
        { title: 'Accounts', value: data.accounts.length },
      ];
      cards.forEach(card => {
        const el = document.createElement('div');
        el.className = 'stat-card';
        el.innerHTML = `<h3>${card.title}</h3><div class="value">${card.value}</div>`;
        statusCards.appendChild(el);
      });
    }

    async function loadAccounts() {
      const res = await fetch('/accounts');
      const data = await res.json();
      accountSelect.innerHTML = '';
      const allOption = document.createElement('option');
      allOption.value = '';
      allOption.textContent = 'All accounts';
      accountSelect.appendChild(allOption);
      data.accounts.forEach(account => {
        const option = document.createElement('option');
        option.value = account.account_id;
        option.textContent = `${account.name} (${account.subtype || account.type})`;
        accountSelect.appendChild(option);
      });
    }

    function buildQueryParams() {
      const params = new URLSearchParams();
      if (accountSelect.value) params.set('account_id', accountSelect.value);
      if (startDateInput.value) params.set('start_date', startDateInput.value);
      if (endDateInput.value) params.set('end_date', endDateInput.value);
      return params;
    }

    async function loadTransactions() {
      const params = buildQueryParams();
      if (limitInput.value) params.set('limit', limitInput.value);
      setStatus('Loading transactions...');
      const res = await fetch(`/transactions?${params.toString()}`);
      const data = await res.json();
      renderTable(data.items || []);
      setStatus(`Showing ${data.items.length} of ${data.total} transactions`);
    }

    function renderTable(items) {
      if (!items.length) {
        tableWrap.innerHTML = '<div class="status-line">No transactions found.</div>';
        return;
      }
      const rows = items.map(item => {
        const merchant = item.merchant_name || item.name || '';
        const isCredit = (item.account_type || '').toLowerCase() === 'credit';
        const displayAmount = isCredit ? -item.amount : item.amount;
        const amountClass = displayAmount < 0 ? 'negative' : 'positive';
        const accountLabel = item.account_name || item.account_id;
        return `
          <tr>
            <td data-label="Date">${item.date || ''}</td>
            <td data-label="Merchant">${merchant} <button class="mini-btn" data-merchant="${merchant}">Rule</button></td>
            <td data-label="Account">${accountLabel}</td>
            <td data-label="Category">${item.category || ''}</td>
            <td data-label="Status">${item.pending ? '<span class="pill">Pending</span>' : 'Posted'}</td>
            <td data-label="Amount" class="amount ${amountClass}">${formatMoney(displayAmount)}</td>
          </tr>
        `;
      }).join('');

      tableWrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Merchant</th>
              <th>Account</th>
              <th>Category</th>
              <th>Status</th>
              <th class="amount">Amount</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    async function loadInsights() {
      const params = buildQueryParams();
      const res = await fetch(`/insights?${params.toString()}`);
      const data = await res.json();
      renderInsights(data);
    }

    function renderInsights(data) {
      renderTotals(data.totals || {});
      renderCalendar(data);
      renderSankey(data);
      renderTreemap(data);
      renderMicro(data);
      renderTopMerchants(data.top_merchants || []);
    }

    function renderTotals(totals) {
      const cards = [
        { title: 'Income', value: formatMoney(totals.income || 0) },
        { title: 'Spend', value: formatMoney(totals.spend || 0) },
        { title: 'Net', value: formatMoney(totals.net || 0) },
      ];
      totalsCards.innerHTML = cards.map(card => `
        <div class="stat-card">
          <h3>${card.title}</h3>
          <div class="value">${card.value}</div>
        </div>
      `).join('');
    }

    function renderCalendar(data) {
      const calendarChart = ensureChart('calendarChart');
      const seriesData = (data.daily_spend || []).map(entry => [entry.date, entry.amount]);
      const maxValue = Math.max(1, ...seriesData.map(entry => entry[1] || 0));
      calendarChart.setOption({
        tooltip: { formatter: params => `${params.value[0]}<br/>${formatMoney(params.value[1])}` },
        visualMap: { min: 0, max: maxValue, show: false },
        calendar: {
          range: [data.range.start_date, data.range.end_date],
          cellSize: ['auto', 16],
          itemStyle: { borderWidth: 0.5, borderColor: '#e2e8f0' },
          yearLabel: { show: false }
        },
        series: {
          type: 'heatmap',
          coordinateSystem: 'calendar',
          data: seriesData
        }
      });
    }

    function renderSankey(data) {
      const sankeyChart = ensureChart('sankeyChart');
      sankeyChart.setOption({
        tooltip: { trigger: 'item', triggerOn: 'mousemove' },
        series: [{
          type: 'sankey',
          data: data.sankey.nodes,
          links: data.sankey.links,
          lineStyle: { color: 'source', curveness: 0.5 },
          emphasis: { focus: 'adjacency' }
        }]
      });
    }

    function renderTreemap(data) {
      const treemapChart = ensureChart('treemapChart');
      treemapChart.setOption({
        tooltip: { formatter: params => `${params.name}<br/>${formatMoney(params.value || 0)}` },
        series: [{
          type: 'treemap',
          data: data.treemap,
          leafDepth: 1,
          label: { show: true, formatter: '{b}' },
          itemStyle: { borderColor: '#f1f5f9' }
        }]
      });
    }

    function renderMicro(data) {
      const microChart = ensureChart('microChart');
      const micro = data.micro_spend || {};
      microChart.setOption({
        grid: { left: 10, right: 10, top: 20, bottom: 20, containLabel: true },
        xAxis: { type: 'value', axisLabel: { formatter: '{value}%' }, splitLine: { show: false } },
        yAxis: { type: 'category', data: ['< $10', '< $20'], axisTick: { show: false } },
        series: [{
          type: 'bar',
          data: [micro.lt_10?.share_count || 0, micro.lt_20?.share_count || 0],
          itemStyle: { color: '#ff7a59' },
          barWidth: 18
        }]
      });

      microStats.innerHTML = `
        <div class="micro-stat"><span>Total spend</span><span>${formatMoney(micro.total?.amount || 0)}</span></div>
        <div class="micro-stat"><span>Transactions</span><span>${micro.total?.count || 0}</span></div>
        <div class="micro-stat"><span>< $10 share</span><span>${micro.lt_10?.share_count || 0}%</span></div>
        <div class="micro-stat"><span>< $20 share</span><span>${micro.lt_20?.share_count || 0}%</span></div>
      `;
    }

    function renderTopMerchants(items) {
      if (!items.length) {
        topMerchants.innerHTML = '<li>No merchant data yet.</li>';
        return;
      }
      topMerchants.innerHTML = items.map(entry => `
        <li><span>${entry.name}</span><span>${formatMoney(entry.amount)}</span></li>
      `).join('');
    }

    async function loadRules() {
      const res = await fetch('/rules');
      const data = await res.json();
      const rules = data.rules || [];
      if (!rules.length) {
        rulesList.innerHTML = '<div class="status-line">No rules yet. Add your first one.</div>';
        return;
      }
      rulesList.innerHTML = rules.map(rule => `
        <div class="rule-pill">#${rule.id} ${rule.match_type} "${rule.pattern}" -> ${rule.category}</div>
      `).join('');
    }

    async function saveRule() {
      const payload = {
        pattern: rulePattern.value,
        match_type: ruleMatch.value,
        category: ruleCategory.value,
        merchant: ruleMerchant.value,
        priority: rulePriority.value
      };
      setStatus('Saving rule...');
      const res = await fetch('/rules', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) {
        setStatus(`Rule save failed: ${data.error}`, 'error');
        return;
      }
      await loadRules();
      if (ruleApply.checked) {
        await applyRules();
      }
      setStatus('Rule saved.');
    }

    async function applyRules() {
      const payload = { mode: 'rules' };
      if (accountSelect.value) payload.account_id = accountSelect.value;
      if (startDateInput.value) payload.start_date = startDateInput.value;
      if (endDateInput.value) payload.end_date = endDateInput.value;
      setStatus('Applying rules...');
      const res = await fetch('/categorize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) {
        setStatus(`Categorize failed: ${data.error}`, 'error');
        return;
      }
      setStatus(`Rules applied to ${data.updated} transactions.`);
      await loadTransactions();
      await loadInsights();
    }

    async function applyLlm() {
      const payload = { mode: 'llm' };
      if (accountSelect.value) payload.account_id = accountSelect.value;
      if (startDateInput.value) payload.start_date = startDateInput.value;
      if (endDateInput.value) payload.end_date = endDateInput.value;
      if (limitInput.value) payload.limit = limitInput.value;
      setStatus('Running AI categorization...');
      const res = await fetch('/categorize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) {
        setStatus(`AI categorize failed: ${data.error}`, 'error');
        return;
      }
      const batches = data.llm?.batches ?? 0;
      const errors = data.llm?.errors ?? 0;
      const errorNote = errors ? ` (${errors} batch errors)` : '';
      setStatus(`AI categorized ${data.updated} transactions across ${batches} batches${errorNote}.`);
      await loadTransactions();
      await loadInsights();
    }

    async function triggerIngest() {
      setStatus('Triggering ingest...');
      const payload = {};
      if (accountSelect.value) payload.account_id = accountSelect.value;
      if (startDateInput.value) payload.start_date = startDateInput.value;
      if (endDateInput.value) payload.end_date = endDateInput.value;
      const res = await fetch('/ingest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!data.ok) {
        setStatus(`Ingest failed: ${data.error}`, 'error');
        return;
      }
      await loadStatus();
      await loadTransactions();
      await loadInsights();
    }

    refreshBtn.addEventListener('click', async () => {
      await loadTransactions();
      await loadInsights();
    });
    ingestBtn.addEventListener('click', triggerIngest);
    applyRulesBtn.addEventListener('click', applyRules);
    llmBtn.addEventListener('click', applyLlm);
    reloadRulesBtn.addEventListener('click', loadRules);
    saveRuleBtn.addEventListener('click', saveRule);
    yearBtn.addEventListener('click', async () => {
      setDefaultRange();
      await loadTransactions();
      await loadInsights();
    });
    monthBtn.addEventListener('click', async () => {
      setMonthRange();
      await loadTransactions();
      await loadInsights();
    });

    tableWrap.addEventListener('click', event => {
      const button = event.target.closest('.mini-btn');
      if (!button) return;
      const merchant = button.getAttribute('data-merchant');
      if (merchant) {
        rulePattern.value = merchant;
        ruleCategory.focus();
      }
    });

    window.addEventListener('resize', () => {
      Object.values(charts).forEach(chart => chart.resize());
    });

    async function boot() {
      setDefaultRange();
      await loadStatus();
      await loadAccounts();
      await loadRules();
      await loadTransactions();
      await loadInsights();
    }

    boot();
  </script>
</body>
</html>
